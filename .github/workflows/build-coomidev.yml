name: Build CoomiDev APK
# 触发新一轮构建：让 TERMUX_APP_VERSION_CODE/NUM 提升（run_number+1），
# 生成更高版本号供 App 内更新检测再次弹出提示（用户点了“暂不更新”后想再看到更新）。
# 说明：触发路径含本 workflow（及 apps/web、apps/coomi-rs、assets）。
# 在 #15(64488f8) 之后做了历史清理并 force-push(6b9194f)；本提交用于触发
# 一次基于新 Secrets(COOMI_SIGNING_*)签名 的构建验证。

# 云端构建 CoomiDev 定制 APK（包名 com.coomidev.android / 应用名 CoomiDev / 引擎端口 18765）。
# 始终内置 Runtime V2（PRoot host + Debian rootfs）——Coomi v1.4.5 引擎运行在 PRoot+Debian 环境，
# 缺这两套资产会像 v1.4.5 精简包那样无法完成引擎部署。
#   - build_type：release（已开混淆）/ debug。
# 签名：每次在本 runner 上用 keytool 生成一把稳定自持的开发签名并写入 local.properties，
#       不依赖仓库内官方 testkey_untrusted.jks 的私有口令。

on:
  # 推送到 main 且改到构建相关文件时自动构建（手机端手动 Run 不方便，故加自动触发）。
  push:
    branches: ["main"]
    paths:
      - 'apps/coomi-app/**'
      - 'apps/coomi-rs/**'
      - 'apps/web/**'
      - 'assets/**'
      - 'gradle/**'
      - '**/*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-coomidev.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建变体"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

concurrency:
  group: build-coomidev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-coomidev:
    runs-on: ubuntu-24.04
    env:
      COOMI_DEV_BUILD: "1"
      TERMUX_PACKAGE_VARIANT: "apt-android-7"
      COOMI_BUNDLE_RUNTIME: "1"
      TERMUX_APP_VERSION_CODE: "${{ github.run_number }}"
      TERMUX_APP_VERSION_NAME: "1.4.${{ github.run_number }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runtime V2 builds an ARM64 Debian rootfs through Docker/QEMU. Free unused
      # hosted-runner toolchains before pulling its image to avoid disk exhaustion.
      - name: Free disk space for Runtime V2
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /usr/share/swift
          docker system prune --all --force --volumes
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Gradle cache is intentionally disabled: GitHub Actions fails while evaluating its hashFiles key during post-job cache save.

      - name: Cache Rust (coomi-rs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/coomi-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/coomi-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages (platform/build-tools + NDK)
        run: |
          set -euxo pipefail
          # :app 用 coomi-app/gradle.properties 里的 ndkVersion=29.0.14206865，
          # termux 子模块读根 gradle.properties 的 27.0.12077973，两版都装。
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "ndk;29.0.14206865"

      - name: Set up Rust + aarch64-linux-android target
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # coomi-rs 通过 rust-toolchain.toml 锁定 channel；Android 目标必须装到该锁定工具链上，
          # 否则 cargo 在 apps/coomi-rs 内切到锁定版本后找不到 aarch64-linux-android 的 core（E0463）。
          COOMI_TC=$(cd apps/coomi-rs && sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' rust-toolchain.toml)
          echo "coomi rust toolchain = ${COOMI_TC}"
          rustup toolchain install --profile minimal "$COOMI_TC"
          rustup target add --toolchain "$COOMI_TC" aarch64-linux-android
          rustc --version
          cargo --version

      - name: Recreate signing keystore from GitHub Secrets
        run: |
          set -euxo pipefail
          mkdir -p signing
          # 仓库公开，keystore 绝不入库；由 Actions Secret(base64) 现场重建。
          B64=$(printf '%s' "${{ secrets.COOMI_SIGNING_KEYSTORE_B64 }}" | tr -d '[:space:]')
          test -n "$B64" || { echo '::error::COOMI_SIGNING_KEYSTORE_B64 is empty or not set'; exit 1; }
          printf '%s' "$B64" | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > signing/coomidev-release.jks
          test -s signing/coomidev-release.jks
          # local.properties is ignored and supplies the signing identity to Gradle (values from Secrets).
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          coomi.signing.storeFile=$GITHUB_WORKSPACE/signing/coomidev-release.jks
          coomi.signing.keyAlias=${{ secrets.COOMI_SIGNING_KEY_ALIAS }}
          coomi.signing.storePassword=${{ secrets.COOMI_SIGNING_STORE_PASS }}
          coomi.signing.keyPassword=${{ secrets.COOMI_SIGNING_KEY_PASS }}
          EOF

      - name: Install web front-end deps
        working-directory: apps/web
        run: |
          npm config set registry https://registry.npmmirror.com
          npm install

      - name: Generate Runtime V2 assets (PRoot host + Debian rootfs)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y mmdebstrap qemu-user-static binfmt-support debian-archive-keyring
          sudo update-binfmts --enable qemu-aarch64
          mkdir -p runtime-v2-dist
          scripts/runtime-v2/build-proot-host.sh
          sudo --preserve-env=RUNTIME_V2_OUTPUT scripts/runtime-v2/build-rootfs.sh
        env:
          RUNTIME_V2_OUTPUT: runtime-v2-dist

      - name: Build CoomiDev APK
        run: |
          set -euxo pipefail
          # gradlew 在上游以 100644 入库（无可执行位），这里显式补上执行权限。
          chmod +x gradlew apps/coomi-app/gradlew
          ./gradlew --no-daemon \
            :app:assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }} \
            --stacktrace

      - name: Locate APK output
        run: |
          set -euxo pipefail
          find apps/coomi-app/app/build/outputs/apk -name '*.apk' -exec ls -la {} +

      - name: Prepare release APK
        run: |
          set -euxo pipefail
          mkdir -p release
          APK=$(find apps/coomi-app/app/build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" "release/CoomiDev-${{ env.TERMUX_APP_VERSION_NAME }}.apk"
          sha256sum release/*.apk > release/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "coomidev-${{ env.TERMUX_APP_VERSION_NAME }}"
          name: "CoomiDev ${{ env.TERMUX_APP_VERSION_NAME }}"
          generate_release_notes: true
          files: |
            release/*.apk
            release/SHA256SUMS.txt
      - name: Upload CoomiDev APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoomiDev-${{ env.TERMUX_APP_VERSION_NAME }}-arm64-v8a
          path: |
            release/*.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
